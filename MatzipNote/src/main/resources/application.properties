spring.application.name=MatzipNote

# ===== 로깅 =====
# 우리 패키지는 debug까지 자세히
logging.level.com.study=debug

# ===== DB 접속 (DataSource) =====
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/matzip?serverTimezone=Asia/Seoul
spring.datasource.username=root
spring.datasource.password=1234

# ===== MyBatis =====
# DTO 패키지: mapper.xml에서 클래스 이름만 써도 되게
mybatis.type-aliases-package=com.study.matzip.model.dto
# mappers 폴더 아래 모든 xml 사용
mybatis.mapper-locations=classpath:mappers/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# ===== JSP (ViewResolver) =====
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp


app.upload.path=${user.home}/matzip-uploads
spring.profiles.active=local

spring.servlet.multipart.max-file-size = 10MB
spring.servlet.multipart.max-request-size = 50MB


# Jackson 3(Boot 4): JSON에 없는 int 필드(예: 새 리뷰의 rno)를 null로 보고 실패하지 않도록 → 기본값 0
spring.jackson.deserialization.fail-on-null-for-primitives=false
