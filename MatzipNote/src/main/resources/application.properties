spring.application.name=MatzipNote

# ===== 로깅 =====
# 우리 패키지는 debug까지 자세히
logging.level.com.study=debug

# ===== DB 접속 (DataSource) =====
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/matzip?serverTimezone=Asia/Seoul
spring.datasource.username=ssafy
spring.datasource.password=ssafy

# ===== MyBatis =====
# DTO 패키지: mapper.xml에서 클래스 이름만 써도 되게
mybatis.type-aliases-package=com.study.matzip.model.dto
# mappers 폴더 아래 모든 xml 사용
mybatis.mapper-locations=classpath:mappers/**/*.xml

# ===== JSP (ViewResolver) =====
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp